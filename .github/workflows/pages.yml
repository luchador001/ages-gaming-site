name: Deploy AGES Gaming to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Replace embedded images with repository assets
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              'src="assets/logo.webp"',
              'src="assets/dragon.webp"',
              'src="assets/dragon.webp"',
          ]
          for replacement in replacements:
              s, count = re.subn(r'src="data:image/webp;base64,[^"]+"', replacement, s, count=1)
              if count != 1:
                  raise RuntimeError('Expected embedded image was not found')
          p.write_text(s, encoding='utf-8')

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
