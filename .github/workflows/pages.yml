name: Deploy AGES Gaming to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Inject stable site layer
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="assets/site-fix.css?v=4">\n<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-dragon.png?v=4">\n'
          js = '<script src="assets/site-fix.js?v=4"></script>\n'
          if 'assets/site-fix.css' not in s:
              s = s.replace('</head>', css + '</head>')
          if 'assets/site-fix.js' not in s:
              s = s.replace('</body>', js + '</body>')
          p.write_text(s, encoding='utf-8')

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
