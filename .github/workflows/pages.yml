name: Deploy AGES Gaming to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Rebuild dragon asset
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib
          parts=sorted(Path('.build').glob('dragon-*.txt'))
          raw=base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          assert len(raw)==93912, (len(raw), 93912)
          assert hashlib.sha256(raw).hexdigest()=='8e42f4c2e0bdb0c096ca331adbf2b37e6873058daeeab1d717daa69976339d74'
          Path('assets/dragon-final.webp').write_bytes(raw)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
