name: Deploy AGES Gaming to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stabilize site
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<img\s+data-asset="logo"', '<img src="assets/logo.webp"', s)
          s=re.sub(r'<img\s+data-asset="dragon"', '<img src="assets/dragon-hq.webp"', s)
          s=re.sub(r'<link rel="stylesheet" href="assets/site-fix\.css[^>]*>\s*','',s)
          s=re.sub(r'<script[^>]+src="assets/site-fix\.js[^>]*></script>\s*','',s)
          s=re.sub(r'<link rel="icon"[^>]*favicon-dragon\.png[^>]*>\s*','',s)
          s=s.replace('</head>','<link rel="stylesheet" href="assets/site-fix.css?v=10">\n<link rel="icon" type="image/png" href="assets/favicon-dragon.png?v=10">\n</head>')
          s=s.replace('</body>','<script src="assets/site-fix.js?v=10"></script>\n</body>')
          p.write_text(s,encoding='utf-8')
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
